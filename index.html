<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMLEX-USA XR Diagnostic Runner Hub</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --card-hover: #1b253b;
      --border: #26334d;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      max-width: 900px;
      width: 100%;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      max-width: 900px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover,
    .card:focus-visible {
      background: var(--card-hover);
      border-color: var(--accent);
      box-shadow: 0 0 24px var(--accent-glow);
      transform: translateY(-3px);
      outline: none;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.65rem;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.85rem;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 1.25rem;
    }

    .launch {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>COMLEX-USA XR Diagnostic Runner</h1>
    <p class="subtitle">Select an organ-system block to launch the 3-Lane Diagnostic Runner.</p>
  </header>

  <main class="grid" id="module-grid"></main>

  <script>
    const STUDY_MODULES = [
      {
        block: "Block 01",
        title: "Gastrointestinal (GI)",
        file: "01._GI_COMLEX-USA_XR_3-Lane_Diagnostic_Runner.html"
      },
      {
        block: "Block 02",
        title: "Cardiology",
        file: "02._Cardiology_COMLEX-USA_XR_3-Lane_Diagnostic_Runner.html"
      },
      {
        block: "Block 03",
        title: "Renal",
        file: "03._Renal_COMLEX-USA_XR_3-Lane_Diagnostic_Runner.html"
      },
      {
        block: "Block 04",
        title: "Respiratory",
        file: "04._Respiratory_COMLEX-USA_XR_3-Lane_Diagnostic_Runner.html"
      },
      {
        block: "Block 05",
        title: "MSK & OMM",
        file: "05._MSK_OMM_COMLEX-USA_XR_3-Lane_Diagnostic_Runner.html"
      }
    ];

    const grid = document.getElementById("module-grid");

    STUDY_MODULES.forEach((mod) => {
      const link = document.createElement("a");
      link.className = "card";
      link.href = mod.file;
      link.innerHTML = `
        <div>
          <span class="badge">${mod.block}</span>
          <h2>${mod.title}</h2>
          <p>${mod.file}</p>
        </div>
        <span class="launch">Launch Runner &rarr;</span>
      `;
      grid.appendChild(link);
    });
  </script>
</body>
</html>
