<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMLEX &amp; Block Runner</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --card-hover: #1b253b;
      --border: #26334d;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.22);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1.5rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-menu {
      max-width: 900px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 1.15rem;
      margin-bottom: 1.75rem;
    }

    .menu-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .menu-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    header {
      max-width: 900px;
      width: 100%;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b0f19;
    }

    .search-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.95rem;
      border-radius: 10px;
      font-size: 0.9rem;
      min-width: 240px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .list {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.95rem 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .list-item:hover,
    .list-item:focus-visible {
      background: var(--card-hover);
      border-color: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
      transform: translateX(3px);
      outline: none;
    }

    .list-main {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .list-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .list-item h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .list-item p {
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }

    .launch {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .list-item {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

        file: "Blocks -Drugs, Bugs, Viruses/04._Respiratory_Pharmacology,_Bugs___Viruses_(1)_v3.8.html"
      },
      {
        category: "DBV",
        block: "DBV 05",
        title: "MSK Pharmacology, Bugs & Viruses (1)",
        file: "Blocks -Drugs, Bugs, Viruses/05._MSK_Pharmacology,_Bugs_Viruses_(1)_v3.8.html"
      }
    ];

    const list = document.getElementById("module-list");
    const tabsContainer = document.getElementById("category-tabs");
    const searchBox = document.getElementById("search-box");

    let activeCategory = "All";
    let searchQuery = "";

    function renderModules() {
      list.innerHTML = "";
      const filtered = STUDY_MODULES.filter((mod) => {
        const matchesCategory = activeCategory === "All" || mod.category === activeCategory;
        const matchesSearch =
          mod.title.toLowerCase().includes(searchQuery) ||
          mod.block.toLowerCase().includes(searchQuery) ||
          mod.file.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      filtered.forEach((mod) => {
        const link = document.createElement("a");
        link.className = "list-item";
        link.href = mod.file;
        let actionText = "Launch Runner &rarr;";
        if (mod.category === "Cornell") actionText = "Open Notes &rarr;";
        if (mod.block === "MSK Tool") actionText = "Open Calculator &rarr;";
        link.innerHTML = `
          <div class="list-main">
            <div class="list-top">
              <span class="badge">${mod.block}</span>
              <h2>${mod.title}</h2>
            </div>
            <p>${mod.file}</p>
          </div>
          <span class="launch">${actionText}</span>
        `;
        list.appendChild(link);
      });
    }

    tabsContainer.addEventListener("click", (e) => {
      if (!e.target.classList.contains("tab-btn")) return;
      document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.remove("active"));
      e.target.classList.add("active");
      activeCategory = e.target.dataset.category;
      renderModules();
    });

    searchBox.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderModules();
    });

    renderModules();
  </script>
</body>
</html>
